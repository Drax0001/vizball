# Compression for every site on this nginx (http context).
# Install:  sudo cp deploy/nginx-compression.conf /etc/nginx/conf.d/compression.conf
#           sudo nginx -t && sudo systemctl reload nginx
#
# /etc/nginx/nginx.conf already has "gzip on;" but its gzip_types line is
# commented out, so only HTML was compressed. Do not repeat "gzip on;" here:
# nginx rejects a duplicated directive in the same context.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    application/vnd.ms-fontobject
    font/otf
    font/ttf
    image/svg+xml
    image/x-icon;
