# classic.vizball.org: the "classic" redesign (branch redesign/classic),
# built in /home/berthold/vizball-classic with VITE_NOINDEX=true.
# Shares the vizball.org backend. Run certbot afterwards for HTTPS:
#   sudo certbot --nginx -d classic.vizball.org
server {
    listen 80;
    listen [::]:80;
    server_name classic.vizball.org;

    root /home/berthold/vizball-classic/dist;
    index index.html;
    client_max_body_size 12M;

    # Preview copy: keep it out of search results (vizball.org is canonical).
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    include /etc/nginx/snippets/vizball-spa.conf;
}
