# Routing for the Vizball React app, with a real 404 status for unknown URLs.
# Install once:  sudo cp deploy/nginx-spa-routes.conf /etc/nginx/snippets/vizball-spa.conf
# Then, in the site's `server { }` block, REPLACE its existing `location / { … }`
# and `location /assets/ { … }` blocks with this one line (nginx rejects
# duplicate locations):
#
#     include /etc/nginx/snippets/vizball-spa.conf;
#
# Known pages are served by the app with status 200. Any other path that is
# not a real file gets status 404; the body is still index.html, so visitors
# see the site's not-found page while search engines see a true 404.
# Keep the route list in sync with src/App.jsx when pages are added.

location = / {
    try_files /index.html =404;
}

location ~ ^/(le-sport|tutoriels|actualites|boutique|forum|media|gouvernance|contact|login|register|admin|association)(/[^/]+)?/?$ {
    try_files $uri /index.html;
}

location / {
    try_files $uri $uri/ =404;
}

error_page 404 /index.html;

# index.html is never cached so a new deploy is picked up immediately.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Long-cache the hashed Vite build assets; serve the pre-compressed .gz
# copies made by `npm run build` (scripts/precompress.mjs).
location /assets/ {
    gzip_static on;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
