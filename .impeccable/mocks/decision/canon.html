<!doctype html>
<html><head><meta charset="utf-8"><title>Federation standard sketch</title>
<style>
*{margin:0;box-sizing:border-box}
body{width:1440px;height:900px;background:#fff;font-family:Arial Black,sans-serif;overflow:hidden;position:relative}
.nav{height:80px;background:#CC0000;display:flex;align-items:center;justify-content:space-between;padding:0 48px;color:#fff;font-size:15px}
.hero{height:600px;background:linear-gradient(90deg,#143D2BEE,#143D2B55),linear-gradient(160deg,#5b6d5f,#20302a);position:relative;color:#fff;padding:140px 80px}
.hero h1{font-size:130px;line-height:.9}.hero p{font-size:24px;margin:24px 0;max-width:600px;font-family:Arial}
.btn{display:inline-block;background:#DBA520;color:#143D2B;padding:18px 30px;font-size:20px;border-radius:6px}
.stats{display:flex;justify-content:space-around;background:#143D2B;color:#DBA520;padding:30px;font-size:48px}
.cards{display:flex;gap:24px;padding:24px 48px}.cards div{flex:1;height:200px;background:#eef2ef;border-radius:8px}
</style></head><body>
<div class="nav"><b>VIZBALL</b><span>Accueil · Le sport · Actualités · Boutique · Contact</span></div>
<div class="hero"><h1>VIZBALL</h1><p>Sport collectif créé au Cameroun en 2007.</p><span class="btn">Découvrir le sport</span></div>
<div class="stats"><span>2007</span><span>4 v 5</span><span>12</span><span>48×24</span></div>
<div class="cards"><div></div><div></div><div></div></div>
</body></html>
